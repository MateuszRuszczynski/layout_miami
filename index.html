<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>BOSE</title>
    <link
      rel="shortcut icon"
      href="src/images/music.png"
      type="image/png"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body>
    <header class="header">
      <img
        class="header__wave"
        src="src/images/waves.svg"
        alt="waves"
      />
      <h1 class="title header__title">
        The world shades.
        <br />
        Your music shines.
      </h1>
    </header>
    <main class="main">
      <h2 class="title title--secondary">Recommended</h2>
      <section class="products">
        <div class="products__wraper">
          <img
            class="photo products__image"
            src="src/images/photos/Image-12.jpg"
            alt="Bose portable Smart speaker"
          />
          <p class="products__name">Bose portable Smart speaker</p>
          <p class="products__category">Smart home</p>
          <p class="products__price">$ 399.00</p>
        </div>
        <div class="products__wraper">
          <img
            class="photo products__image"
            src="src/images/photos/Image-11.jpg"
            alt="SoundLink Flex Bluetooth speaker"
          />
          <p class="products__name">SoundLink Flex Bluetooth speaker</p>
          <p class="products__category">Portable bluetooth</p>
          <p class="products__price">$ 149.00</p>
        </div>
        <div class="products__wraper">
          <img
            class="photo products__image"
            src="src/images/photos/Image-10.jpg"
            alt="SoundLink Color Bluetooth speaker II"
          />
          <p class="products__name">SoundLink Color Bluetooth speaker II</p>
          <p class="products__category">Portable bluetooth</p>
          <p class="products__price">$ 129.00</p>
        </div>
      </section>
    </main>
  </body>
</html>
