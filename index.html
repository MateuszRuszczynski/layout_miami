<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>BOSE</title>
    <link
      rel="shortcut icon"
      href="src/images/music.png"
      type="image/png"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body>
    <header class="header">
      <img
        class="header__wave"
        src="src/images/waves.svg"
        alt="waves"
      />
      <h1 class="title header__title">
        The world shades.
        <br />
        Your music shines.
      </h1>
    </header>
    <main class="main">
      <section
        class="products"
        id="recommended"
      >
        <h2 class="products__title title title--secondary">Recommended</h2>

        <ul class="products__list">
          <li class="products__item">
            <article class="product-card">
              <img
                class="product-card__image"
                src="src/images/photos/Image-12.jpg"
                alt="Bose portable Smart speaker"
              />
              <h3 class="product-card__name">Bose portable Smart speaker</h3>
              <p class="product-card__category">Smart home</p>
              <p class="product-card__price">$ 399.00</p>
            </article>
          </li>

          <li class="products__item">
            <article class="product-card">
              <img
                class="product-card__image"
                src="src/images/photos/Image-11.jpg"
                alt="SoundLink Flex Bluetooth speaker"
              />
              <h3 class="product-card__name">
                SoundLink Flex Bluetooth speaker
              </h3>
              <p class="product-card__category">Portable bluetooth</p>
              <p class="product-card__price">$ 149.00</p>
            </article>
          </li>

          <li class="products__item">
            <article class="product-card">
              <img
                class="product-card__image"
                src="src/images/photos/Image-10.jpg"
                alt="SoundLink Color Bluetooth speaker II"
              />
              <h3 class="product-card__name">
                SoundLink Color Bluetooth speaker II
              </h3>
              <p class="product-card__category">Portable bluetooth</p>
              <p class="product-card__price product-card__price--no-margin">
                $ 129.00
              </p>
            </article>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
